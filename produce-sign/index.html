function say(t){$('status').textContent=t}function readFile(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('讀取失敗'));r.readAsDataURL(file)})}

function settings(){let v={};ids.forEach(id=>v[id]=$(id).value);return v}

function text(ctx,key,box){let value=$(key).value.slice(0,key==='cn'?40:120);if(value===defaults[key]&&!customFont&&$('font').value==='SimHei'){ctx.drawImage(imgs[key],...box);return}if(!value)return;let [x,y,w,h]=box;let lines=value.replace(/\r/g,'').split('\n');let c=document.createElement('canvas');c.width=2400;c.height=1200;let t=c.getContext('2d');t.fillStyle='#fa1018';t.textBaseline='top';t.font=`${key==='cn'?'':'normal '}160px "${customFont|| (key==='cn'?$('font').value:'SimHei')}", "Microsoft YaHei", sans-serif`;let max=Math.max(...lines.map(l=>t.measureText(l).width),1);let lineH=190; c.width=Math.ceil(max+30);c.height=lines.length*lineH+30;t=c.getContext('2d');t.fillStyle='#fa1018';t.textBaseline='top';t.font=`160px "${customFont||(key==='cn'?$('font').value:'SimHei')}", "Microsoft YaHei", sans-serif`;lines.forEach((l,i)=>t.fillText(l,10,10+i*lineH));let d=t.getImageData(0,0,c.width,c.height),left=c.width,right=0,top=c.height,bottom=0;for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++)if(d.data[(yy*c.width+xx)*4+3]){left=Math.min(left,xx);right=Math.max(right,xx);top=Math.min(top,yy);bottom=Math.max(bottom,yy)}if(right>=left)ctx.drawImage(c,left,top,right-left+1,bottom-top+1,x,y,w,h)}

$('fontFile').onchange=async e=>{try{if(e.target.files[0]){await setFont(await readFile(e.target.files[0]));render()}}catch(e){say('字型無法載入。')}};$('font').onchange=()=>{customFont=customFontData=null;render()};
$('export').onclick=async()=>{try{let {c,d}=output();download(await pngDpi(c,d.dpi),($('cn').value||'果蔬牌子').replace(/[\\/:*?"<>|]/g,'_')+'.png');say('PNG 已匯出。')}catch(e){say(e.message)}};
$('print').onclick=async()=>{try{let {c,d}=output(),im=$('printImage');im.src=c.toDataURL('image/png');im.style.width=d.mm+'mm';im.style.height=(d.mm*304/606)+'mm';await im.decode();window.print()}catch(e){say(e.message)}};
$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,values:settings(),photo:photoData,font:customFontData})],{type:'application/json'}),'果蔬牌子資料.json');
$('load').onchange=async e=>{try{if(!e.target.files[0])return;let obj=JSON.parse(await e.target.files[0].text());if(obj.version!==1||!obj.values)throw Error('不是有效的牌子資料');let im=obj.photo?await imageFrom(obj.photo):null;if(obj.font)await setFont(obj.font);else customFont=customFontData=null;ids.forEach(id=>{if(obj.values[id]!==undefined)$(id).value=String(obj.values[id])});photo=im;photoData=obj.photo||null;render()}catch(e){say('載入失敗：'+e.message)}};
$('reset').onclick=()=>{if(confirm('恢復模板內容？請先儲存需要保留的資料。'))location.reload()};
(async()=>{try{await Promise.all(Object.keys(ASSETS).map(async k=>imgs[k]=await imageFrom(ASSETS[k])));photo=imgs.photo;ready=true;render()}catch(e){say('模板載入失敗：'+e.message)}})();
</script></html>
